name: Build EduSphere Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project (fresh, from Capacitor)
        run: npx cap add android

      - name: Apply EduSphere overrides onto the generated project
        run: |
          cp -f android-overrides/build.gradle android/build.gradle
          cp -f android-overrides/variables.gradle android/variables.gradle
          cp -f android-overrides/gradle.properties android/gradle.properties
          cp -f android-overrides/app/build.gradle android/app/build.gradle
          cp -f android-overrides/app/proguard-rules.pro android/app/proguard-rules.pro
          cp -f android-overrides/app/google-services.json android/app/google-services.json
          cp -f android-overrides/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/cletustech/edusphere
          cp -f android-overrides/app/src/main/java/com/cletustech/edusphere/MainActivity.java android/app/src/main/java/com/cletustech/edusphere/MainActivity.java
          cp -f android-overrides/app/src/main/res/values/colors.xml android/app/src/main/res/values/colors.xml
          cp -f android-overrides/app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
          cp -f android-overrides/app/src/main/res/values/styles.xml android/app/src/main/res/values/styles.xml
          mkdir -p android/app/src/main/res/drawable
          cp -f android-overrides/app/src/main/res/drawable/ic_stat_notify.xml android/app/src/main/res/drawable/ic_stat_notify.xml

      - name: Generate launcher icons & splash screen from resources/
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor config, plugins, and web assets
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: edusphere-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edusphere-release-apk
          path: android/app/build/outputs/apk/release/*.apk
