<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #E8EFFC; font-family: 'Inter', system-ui, -apple-system, sans-serif;
    height: 100%;
    /* Module 1.4 Phase 1 — smooth native momentum scrolling everywhere (esp. Android/iOS
       WebView), no double-scroll / bounce-fighting, no scroll chaining into parent frames. */
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: none;
    scroll-behavior: smooth;
  }
  #root {
    min-height: 100%;
    /* Phase 2.8: safe-area handling for notched/punch-hole Android + iOS devices.
       env(safe-area-inset-*) resolves to 0 on devices without a notch, so this
       has zero visual effect anywhere it isn't needed — purely additive. */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  button, select, input { font-family: inherit; }
  button { -webkit-appearance: none; }
  /* Hardware-accelerated, jank-free scroll containers used by dropdown lists, long
     option lists, and modals — promotes them to their own compositor layer so opening
     one never freezes or double-scrolls the page underneath it. */
  .flScrollY {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    overflow-y: auto;
    transform: translateZ(0);
    will-change: scroll-position;
    touch-action: pan-y;
  }
  .flNoScrollX { overscroll-behavior-x: none; touch-action: pan-y; }
  select.flNativeSelect { touch-action: manipulation; }
  ::-webkit-scrollbar { width: 0px; height: 0px; }
  @keyframes flPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes flMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes flLogoIn { 0% { opacity: 0; transform: scale(0.72); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes flFadeUp { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes flFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes flFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
  @keyframes flGlowPulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.12); } }
  @keyframes flDotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes flBarSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  /* Smart Info Carousel — elegant, GPU-accelerated (transform + opacity only) */
  @keyframes flCarouselEnterRight { 0% { opacity: 0; transform: translate3d(22px,0,0) scale(0.97); } 100% { opacity: 1; transform: translate3d(0,0,0) scale(1); } }
  @keyframes flCarouselEnterLeft { 0% { opacity: 0; transform: translate3d(-22px,0,0) scale(0.97); } 100% { opacity: 1; transform: translate3d(0,0,0) scale(1); } }
  @keyframes flCarouselGlow { 0%, 100% { box-shadow: 0 0 0 rgba(211,47,47,0); } 50% { box-shadow: 0 0 18px rgba(211,47,47,0.4); } }
  /* Scanning Mode — GPU-accelerated (transform + opacity only), spring-style easing */
  @keyframes flScanCardIn { 0% { opacity: 0; transform: translate3d(0,10px,0) scale(0.98); } 100% { opacity: 1; transform: translate3d(0,0,0) scale(1); } }
  @keyframes flScanPopIn { 0% { opacity: 0; transform: scale(0.5); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes flScanShake { 0%, 100% { transform: translate3d(0,0,0); } 20% { transform: translate3d(-6px,0,0); } 40% { transform: translate3d(6px,0,0); } 60% { transform: translate3d(-4px,0,0); } 80% { transform: translate3d(4px,0,0); } }
  @keyframes flScanRipple { 0% { transform: scale(0); opacity: 0.45; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes flScanStreakPop { 0% { opacity: 0; transform: translate3d(0,6px,0) scale(0.85); } 100% { opacity: 1; transform: translate3d(0,0,0) scale(1); } }
  @keyframes flScanConfettiFall { 0% { opacity: 1; transform: translate3d(0,-6px,0) rotate(0deg); } 100% { opacity: 0; transform: translate3d(var(--dx,0px),90px,0) rotate(320deg); } }
  /* Academic Selection screens — Continue button */
  @keyframes flSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes flContinueIn { 0% { opacity: 0; transform: translate3d(0,14px,0); } 100% { opacity: 1; transform: translate3d(0,0,0); } }
  .flContinueBtn { transition: transform .15s ease, box-shadow .2s ease; }
  .flContinueBtn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(21,101,192,0.34); }
  .flContinueBtn:not(:disabled):active { transform: translateY(0) scale(0.97); }
  .flRippleSpan { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.5); transform: scale(0); animation: flScanRipple .6s ease-out forwards; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase (compat SDK — works with plain <script> tags, no bundler required) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<!-- Plain (non-Babel) watchdog: runs even if the React/Babel script below fails
     to parse or throws before it can mount anything. Guarantees the splash
     screen is never left on-screen forever, no matter what breaks upstream. -->
<script>
  console.log("[EduSphere] App started");
  window.__FL_BOOTED = false;
  window.__FL_LAST_ERROR = null;
  window.addEventListener("error", function (e) {
    window.__FL_LAST_ERROR = (e.error && e.error.message) || e.message || String(e);
    console.error("[EduSphere] Uncaught error:", e.error || e.message);
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__FL_LAST_ERROR = (e.reason && e.reason.message) || String(e.reason);
    console.error("[EduSphere] Unhandled promise rejection:", e.reason);
  });

  // content:// (and some file://) pages block loading remote <script src>
  // tags for security reasons — React, Babel, and Firebase all fail silently
  // in that case. Detect it early so the fallback screen below gives the
  // *actual* reason instead of a generic "something broke" message.
  var __FL_PROTOCOL_ISSUE = (window.location.protocol === "content:" || window.location.protocol === "file:");
  if (__FL_PROTOCOL_ISSUE) {
    console.error("[EduSphere] Page loaded over " + window.location.protocol + " — remote scripts (React/Firebase) may be blocked. Serve this file over http:// or https:// instead.");
  }

  // Shortened from 12s to 8s so a stuck user isn't staring at a blank splash
  // for as long, and the message now explains *why* it likely happened
  // (content:// / file:// origin) instead of only "check your connection".
  setTimeout(function () {
    if (window.__FL_BOOTED) return;
    var root = document.getElementById("root");
    if (root && root.children.length === 0) {
      console.error("[EduSphere] App never booted within 8s — showing fallback error screen.");
      var reasonHtml = __FL_PROTOCOL_ISSUE
        ? 'This page was opened as <code style="background:rgba(255,255,255,0.15);padding:1px 5px;border-radius:4px;">' +
          window.location.protocol + '//</code> — browsers block React/Firebase from loading over that protocol. ' +
          'Open this file through a real web server (http:// or https://) instead — see the hosting instructions ' +
          'you were given, or tap the link/QR code again rather than opening the file directly.'
        : 'The app failed to load — usually a network issue loading React or Firebase, or a script error. ' +
          'Check your connection, then reload the page.' +
          (window.__FL_LAST_ERROR ? ' Last error: <code style="background:rgba(255,255,255,0.15);padding:1px 5px;border-radius:4px;">' + String(window.__FL_LAST_ERROR).slice(0, 160) + '</code>' : '');
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;font-family:system-ui,-apple-system,sans-serif;background:#0F1E33;' +
        'color:#fff;text-align:center;">' +
        '<div style="max-width:340px;">' +
        '<div style="font-size:36px;margin-bottom:14px;">&#9888;&#65039;</div>' +
        '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">EduSphere couldn\'t start</div>' +
        '<div style="font-size:13px;opacity:0.9;line-height:1.6;">' + reasonHtml + '</div>' +
        '<button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;border-radius:10px;' +
        'border:none;background:#1565C0;color:#fff;font-weight:700;font-size:13px;">Reload</button>' +
        "</div></div>";
    }
  }, 8000);
</script>

<!-- ============================================================
     Phase 2.1/2.2/2.3 modular scripts — loaded in dependency order.
     Each is a plain (non-module) Babel script so top-level consts/functions
     stay globally accessible to files loaded after them, exactly like the
     original single-file app. This is what makes the split behavior-neutral
     with zero bundler.
     ============================================================ -->
<script type="text/babel" src="src/config/appConfig.js"></script>
<script type="text/babel" src="src/services/logger.js"></script>
<script type="text/babel" src="src/firebase/init.js"></script>
<script type="text/babel" src="src/services/uploadManager.js"></script>

<!-- Everything below is the not-yet-further-split remainder of the original
     app (screens, components, hooks, community/quiz/admin/dashboard logic).
     Behaviorally identical to the original file with only the now-centralized
     Firebase/config declarations removed (see src/legacy/app-legacy.js header
     comment + MIGRATION_STATUS.md for exactly what moved and what's next). -->
<script type="text/babel" src="src/legacy/app-legacy.js"></script>

<script type="text/babel">
ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><EduSphere /></AppErrorBoundary>);
</script>
</body>
</html>
