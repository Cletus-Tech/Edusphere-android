apply plugin: 'com.android.application'

android {
    namespace "com.cletustech.edusphere"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.cletustech.edusphere"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ===== PLACEHOLDER: bump versionCode by 1 for every Play Store release =====
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ===== PLACEHOLDER: signing — reads from CI secrets (see .github/workflows/build-android.yml) =====
    // Locally, export these as env vars, or replace with a keystore.properties file if you prefer.
    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ===== Firebase Cloud Messaging — required by @capacitor/push-notifications =====
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

// ===== PLACEHOLDER: only activates once you add app/google-services.json =====
// Build succeeds without it (push notifications simply won't register a token until you add it).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    println "⚠️  google-services.json not found — Firebase push notifications disabled until you add it to android/app/"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text.contains('REPLACE-WITH')) {
        println "⚠️  google-services.json is still the placeholder — replace it with your real Firebase config."
    }
} catch (ignored) { }
