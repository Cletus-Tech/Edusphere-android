name: Generate Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore release-key.jks -alias edusphere \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "TempPass123!" -keypass "TempPass123!" \
            -dname "CN=Cletus Tech, OU=EduSphere, O=Cletus Tech, L=Akure, ST=Ondo, C=NG"
          base64 -w 0 release-key.jks > keystore-base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: edusphere-signing-key
          path: |
            release-key.jks
            keystore-base64.txt
          retention-days: 1
